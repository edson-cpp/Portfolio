name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Build
        run: |
          rm -rf build
          mkdir build
          cd build
          emcmake cmake -G Ninja ..
          cmake --build .
          cmake --build . --target Portfolio-parcel

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 91.99.28.248 >> ~/.ssh/known_hosts

      - name: Deploy files
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            build/bin/ edson@91.99.28.248:/var/www/edsonaguiar.dev/

      - name: Purge changed files from Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          FILES=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" \
            | grep '^static/' \
            | sed 's#^static#https://edsonaguiar.dev#' \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')

          if [ "$FILES" = "[]" ]; then
            echo "No static files changed. Nothing to purge."
            exit 0
          fi

          echo "Files to purge:"
          echo "$FILES" | jq .

          curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"files\":$FILES}" \
            | tee purge-response.json

          jq -e '.success == true' purge-response.json            

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no edson@91.99.28.248 \
          "ls -l /var/www/edsonaguiar.dev/index.html"
